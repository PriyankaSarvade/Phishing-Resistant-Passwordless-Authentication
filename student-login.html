<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cyberNova | Student Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page-body">
    <div class="login-card">
        <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Home</a>
        <div class="logo"><i class="fa-solid fa-shield-halved logo-icon"></i> cyber<span>Nova</span></div>
        <div class="portal-indicator student-tag"><i class="fa-solid fa-graduation-cap"></i> Student Portal</div>
        
        <p class="subtitle">Passwordless &bull; Phishing-Resistant &bull; Biometric</p>

        <div class="input-group">
            <label for="username"><i class="fa-solid fa-envelope"></i> College Email Address</label>
            <input type="email" id="username" placeholder="student@nkocet.edu" value="student@nkocet.edu" required>
        </div>

        <button type="button" id="passkeyLogin" class="passkey-btn">
            <i class="fa-solid fa-fingerprint"></i> Sign In with Passkey / Biometrics
        </button>

        <div class="proximity-note">
            <i class="fa-brands fa-bluetooth-b"></i> <span>Supports Phone Proximity (Scan QR with iPhone / Android)</span>
        </div>

        <div class="register-box">
            <p>First time on this device?</p>
            <button type="button" id="registerPasskey" class="register-btn">
                <i class="fa-solid fa-plus-circle"></i> Enroll New Device Passkey
            </button>
        </div>

        <div id="statusMessage" class="status-box hidden"></div>
    </div>

    <!-- Script Modules -->
    <script type="module" src="passkey-register.js"></script>
    <script type="module" src="passkey-login.js"></script>
</body>
</html>
