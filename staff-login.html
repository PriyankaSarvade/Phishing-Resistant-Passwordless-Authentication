<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cyberNova | Staff Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page-body">

    <div class="login-card">
        <a href="index.html" class="back-link">&larr; Back to Home</a>
        <div class="logo">cyber<span>Nova</span></div>
        <div class="subtitle">Staff Portal — Passwordless Login</div>

        <div class="input-group">
            <label for="username">College Email / Username</label>
            <input type="email" id="username" placeholder="staff@nkocet.edu" required>
        </div>

        <!-- Links to a success/dashboard state for frontend demonstration -->
        <a href="staff-dashboard.html" class="passkey-btn" style="text-decoration: none;">
            <i class="fa-solid fa-fingerprint"></i> Sign in with Passkey
        </a>

        <div class="footer-text">
            New device? <a href="#">Register your passkey here</a>
        </div>
    </div>

</body>
</html>
